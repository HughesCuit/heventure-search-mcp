name: Publish to PyPI

# push to main 时自动 bump patch 版本并发布

permissions:
  contents: write
  id-token: write

on:
  push:
    branches: [ main ]
    paths:
      - 'heventure_search_mcp/**'
      - 'pyproject.toml'
      - 'server.json'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version-check.outputs.should_publish }}
      new_version: ${{ steps.version-check.outputs.new_version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install --upgrade pip packaging requests

    - name: Check and update version
      id: version-check
      run: |
        python << 'PYEOF'
        import re, os, json
        from packaging import version
        import requests

        def get_current_version():
            with open('pyproject.toml') as f:
                m = re.search(r'version = "([^"]+)"', f.read())
            return m.group(1) if m else None

        def get_pypi_version():
            try:
                r = requests.get('https://pypi.org/pypi/heventure-search-mcp/json', timeout=10)
                if r.status_code == 200:
                    return r.json()['info']['version']
            except:
                pass
            return None

        def bump_version(cur, bump_type):
            v = version.parse(cur)
            if bump_type == 'major': return f"{v.major+1}.0.0"
            elif bump_type == 'minor': return f"{v.major}.{v.minor+1}.0"
            else: return f"{v.major}.{v.minor}.{v.micro+1}"

        def update_version_files(new_ver):
            # pyproject.toml
            with open('pyproject.toml') as f:
                c = f.read()
            c = re.sub(r'^version = "[^"]+"', f'version = "{new_ver}"', c, count=1, flags=re.MULTILINE)
            with open('pyproject.toml', 'w') as f:
                f.write(c)
            # server.json
            try:
                with open('server.json') as f:
                    d = json.load(f)
                d['version'] = new_ver
                with open('server.json', 'w') as f:
                    json.dump(d, f, indent=2, ensure_ascii=False)
            except: pass

        cur = get_current_version()
        pypi = get_pypi_version()
        bump_type = os.environ.get('VERSION_TYPE', 'patch')
        if os.environ.get('INPUT_VERSION_TYPE'):
            bump_type = os.environ['INPUT_VERSION_TYPE']

        should_publish = False
        new_version = cur

        if pypi is None:
            should_publish = True
            print("First time publishing")
        elif version.parse(cur) <= version.parse(pypi):
            new_version = bump_version(cur, bump_type)
            update_version_files(new_ver)
            should_publish = True
            print(f"Bumped to {new_version}")
        else:
            should_publish = True
            print(f"Current {cur} > PyPI {pypi}, publishing as-is")

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"should_publish={str(should_publish).lower()}\n")
            f.write(f"new_version={new_version}\n")
        PYEOF

    - name: Commit version changes
      if: steps.version-check.outputs.should_publish == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pyproject.toml server.json
        if git diff --staged --quiet; then
          echo "No version changes to commit"
        else
          git commit -m "chore: bump version to ${{ steps.version-check.outputs.new_version }}"
          git push
        fi

  publish:
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: python -m pip install --upgrade pip build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: python -m twine check dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload dist/*

    - name: Create Git Tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag v${{ needs.version-check.outputs.new_version }}
        git push origin v${{ needs.version-check.outputs.new_version }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.version-check.outputs.new_version }}
        name: Release v${{ needs.version-check.outputs.new_version }}
        generate_release_notes: true
